databases:
  - name: family-monitor-db
    plan: free
    databaseName: family_monitor
    user: family_monitor

services:
  - type: web
    name: family-monitor-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: family-monitor-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
